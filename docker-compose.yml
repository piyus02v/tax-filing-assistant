version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: tax-assistant-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: tax_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  qdrant:
    image: qdrant/qdrant:latest
    container_name: tax-assistant-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build: ./backend
    container_name: tax-assistant-backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - postgres
      - qdrant
    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: tax-assistant-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_storage:
